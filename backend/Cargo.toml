[package]
name = "lumens-block-backend"
version = "0.1.0"
edition = "2021"
description = "LumensBlock backend service — Soroban contract compilation and deployment API"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
tower = { version = "0.4", features = ["util"] }
regex = "1.10"

[dev-dependencies]
http-body-util = "0.1"
